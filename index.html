function polarToCartesian(cx, cy, r, angleDeg) {
  const angleRad = ((angleDeg - 90) * Math.PI) / 180;
  return { x: cx + r * Math.cos(angleRad), y: cy + r * Math.sin(angleRad) };
}

function describeDonutSlice(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const startOuter = polarToCartesian(cx, cy, rOuter, endAngle);
  const endOuter = polarToCartesian(cx, cy, rOuter, startAngle);
  const startInner = polarToCartesian(cx, cy, rInner, endAngle);
  const endInner = polarToCartesian(cx, cy, rInner, startAngle);
  const largeArc = endAngle - startAngle <= 180 ? 0 : 1;
  return [
    "M", startOuter.x, startOuter.y,
    "A", rOuter, rOuter, 0, largeArc, 0, endOuter.x, endOuter.y,
    "L", endInner.x, endInner.y,
    "A", rInner, rInner, 0, largeArc, 1, startInner.x, startInner.y,
    "Z",
  ].join(" ");
}

function DonutChart({ data, size = 200 }) {
  const total = data.reduce((a, d) => a + d.value, 0);
  const cx = size / 2;
  const cy = size / 2;
  const rOuter = size * 0.4;
  const rInner = size * 0.28;
  if (total <= 0) {
    return (
      <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", height: "100%" }}>
        <circle cx={cx} cy={cy} r={rOuter} fill="none" stroke={COLORS.border} strokeWidth={rOuter - rInner} />
      </svg>
    );
  }
  if (data.length === 1) {
    return (
      <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", height: "100%" }}>
        <circle cx={cx} cy={cy} r={(rOuter + rInner) / 2} fill="none" stroke={data[0].color} strokeWidth={rOuter - rInner} />
      </svg>
    );
  }
  let cumulative = 0;
  const slices = data.map((d) => {
    const startAngle = (cumulative / total) * 360;
    cumulative += d.value;
    const endAngle = (cumulative / total) * 360;
    return { ...d, path: describeDonutSlice(cx, cy, rOuter, rInner, startAngle, Math.max(endAngle, startAngle + 0.4)) };
  });
  return (
    <svg viewBox={`0 0 ${size} ${size}`} style={{ width: "100%", height: "100%" }}>
      {slices.map((s, i) => (
        <path key={i} d={s.path} fill={s.color} />
      ))}
    </svg>
  );
}

function TrendLineChart({ data, color, width = 320, height = 170 }) {
  if (!data || data.length === 0) return null;
  const values = data.map((d) => d.saldo);
  const min = Math.min(0, ...values);
  const max = Math.max(...values, 1);
  const padTop = 14;
  const padBottom = 26;
  const padX = 28;
  const plotW = width - padX * 2;
  const plotH = height - padTop - padBottom;
  const xStep = data.length > 1 ? plotW / (data.length - 1) : 0;
  function toXY(i, v) {
    const x = padX + i * xStep;
    const range = max - min || 1;
    const y = padTop + plotH - ((v - min) / range) * plotH;
    return { x, y };
  }
  const points = data.map((d, i) => toXY(i, d.saldo));
  const pathD = points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");

  return (
    <svg viewBox={`0 0 ${width} ${height}`} style={{ width: "100%", height: "auto" }}>
      {[0, 0.5, 1].map((t, i) => (
        <line
          key={i}
          x1={padX}
          x2={width - padX}
          y1={padTop + plotH * t}
          y2={padTop + plotH * t}
          stroke={COLORS.border}
          strokeDasharray="3 3"
        />
      ))}
      <path d={pathD} fill="none" stroke={color} strokeWidth="2.5" />
      {points.map((p, i) => (
        <circle key={i} cx={p.x} cy={p.y} r="3.2" fill={color} />
      ))}
      {data.map((d, i) => {
        const p = toXY(i, d.saldo);
        return (
          <text key={i} x={p.x} y={height - 6} fontSize="10" fill={COLORS.inkSoft} textAnchor="middle">
            {d.mes}
          </text>
        );
      })}
    </svg>
  );
}

const MESES_PT = [
  "Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho",
  "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro",
];
const MESES_ABREV = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];

function monthKeyToLabel(key) {
  const [y, m] = String(key).split("-").map(Number);
  if (!y || !m || !MESES_PT[m - 1]) return key;
  return `${MESES_PT[m - 1]}/${y}`;
}

function monthKeyToShort(key) {
  const [y, m] = String(key).split("-").map(Number);
  if (!y || !m || !MESES_ABREV[m - 1]) return key;
  return `${MESES_ABREV[m - 1]}/${String(y).slice(2)}`;
}

function shiftMonthKey(key, delta) {
  let [y, m] = String(key).split("-").map(Number);
  m += delta;
  while (m > 12) {
    m -= 12;
    y += 1;
  }
  while (m < 1) {
    m += 12;
    y -= 1;
  }
  return `${y}-${String(m).padStart(2, "0")}`;
}

function normalizeStr(s) {
  return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

function monthKeyFromLabel(label) {
  if (!label || typeof label !== "string" || !label.includes("/")) return null;
  const [monthName, yearStr] = label.split("/");
  const year = parseInt(yearStr, 10);
  if (!Number.isFinite(year)) return null;
  const idx = MESES_PT.findIndex((m) => normalizeStr(m) === normalizeStr(monthName));
  if (idx === -1) return null;
  return `${year}-${String(idx + 1).padStart(2, "0")}`;
}

// Constrói a estrutura { months, activeMonth } a partir do que estiver salvo,
// migrando automaticamente o formato antigo (um único mês, sem histórico).
// Garante que todo gasto tenha o campo "cartao" (dados salvos antes dessa
// função existir não têm) e que as listas das abinhas existam.
function normalizeMonthData(m) {
  const fix = (arr) => (Array.isArray(arr) ? arr : []).map((i) => ({ ...i, cartao: normCartao(i.cartao) }));
  // despesas da casa: além do cartão, "pago com" (dinheiro ou vale). Se o item nunca teve o
  // campo, entra o padrão da tabela acima (por id); se já tem, só limpa o valor.
  const fixCasa = (arr) =>
    fix(arr).map((i) => {
      if (i.vale === undefined) {
        const d = DEFAULT_VALE_POR_ID[i.id];
        return { ...i, vale: d ? d.vale : "nenhum", valeValor: d ? d.valeValor : 0 };
      }
      return { ...i, vale: normVale(i.vale), valeValor: Math.max(Number(i.valeValor) || 0, 0) };
    });
  const div = m.divisao || {};
  return {
    ...m,
    parcelasPagas: m.parcelasPagas && typeof m.parcelasPagas === "object" ? m.parcelasPagas : {},
    gastosFixos: fixCasa(m.gastosFixos),
    gastosEssenciais: fixCasa(m.gastosEssenciais),
    gastosNaoEssenciais: fixCasa(m.gastosNaoEssenciais),
    divisao: {
      ...DEFAULT_MONTH_DATA.divisao,
      ...div,
      gastosBarbara: fix(div.gastosBarbara),
      gastosBruno: fix(div.gastosBruno),
    },
  };
}

// Campos que ficam na raiz (valem pra todos os meses): compras parceladas e
// configuração dos cartões. Dados salvos antes disso não têm — entram os padrões.
function normParcelamento(p) {
  if (!p || typeof p !== "object") return null;
  const parcelas = Math.floor(Number(p.parcelas));
  const valorTotal = Number(p.valorTotal);
  if (!Number.isFinite(parcelas) || parcelas < 1 || !Number.isFinite(valorTotal)) return null;
  if (!/^\d{4}-\d{2}$/.test(String(p.inicio))) return null;
  return {
    id: String(p.id || uid()),
    nome: String(p.nome || "Compra parcelada"),
    valorTotal,
    parcelas,
    inicio: String(p.inicio),
    visivelDe: /^\d{4}-\d{2}$/.test(String(p.visivelDe)) ? String(p.visivelDe) : "",
    cartao: normCartao(p.cartao),
    destino: ["casa", "barbara", "bruno"].includes(p.destino) ? p.destino : "casa",
    dataCompra: typeof p.dataCompra === "string" ? p.dataCompra : "",
  };
}

function withRootExtras(root, parsed) {
  const cfg = (parsed && parsed.cartoes) || {};
  return {
    ...root,
    parcelamentos: Array.isArray(parsed && parsed.parcelamentos)
      ? parsed.parcelamentos.map(normParcelamento).filter(Boolean)
      : [],
    cartoes: {
      barbara: { ...DEFAULT_CARTOES_CFG.barbara, ...(cfg.barbara || {}) },
      bruno_xp: { ...DEFAULT_CARTOES_CFG.bruno_xp, ...(cfg.bruno_xp || {}) },
      bruno_nubank: { ...DEFAULT_CARTOES_CFG.bruno_nubank, ...(cfg.bruno_nubank || {}) },
    },
  };
}

function buildInitialRootData(parsed) {
  return withRootExtras(buildMonthsRoot(parsed), parsed);
}

function buildMonthsRoot(parsed) {
  if (parsed && parsed.months && typeof parsed.months === "object") {
    const keys = Object.keys(parsed.months);
    if (keys.length === 0) {
      return {
        months: { [DEFAULT_MONTH_KEY]: normalizeMonthData(deepCopy(DEFAULT_MONTH_DATA)) },
        activeMonth: DEFAULT_MONTH_KEY,
      };
    }
    const months = {};
    keys.forEach((k) => {
      months[k] = normalizeMonthData(parsed.months[k]);
    });
    const activeMonth = months[parsed.activeMonth] ? parsed.activeMonth : keys.sort()[keys.length - 1];
    return { months, activeMonth };
  }
  if (parsed && parsed.receitas) {
    // formato antigo: um único mês solto, sem histórico
    const key = monthKeyFromLabel(parsed.mesReferencia) || DEFAULT_MONTH_KEY;
    const monthData = deepCopy(DEFAULT_MONTH_DATA);
    const clone = { ...parsed };
    delete clone.mesReferencia;
    Object.assign(monthData, clone);
    return { months: { [key]: normalizeMonthData(monthData) }, activeMonth: key };
  }
  return {
    months: { [DEFAULT_MONTH_KEY]: normalizeMonthData(deepCopy(DEFAULT_MONTH_DATA)) },
    activeMonth: DEFAULT_MONTH_KEY,
  };
}

// Um mês novo herda os gastos previstos do mês de partida (zerando "pago"),
// mas começa com as abinhas VAZIAS: o que cada um gastou no mês passado não
// pode descontar da sobra do mês novo.
function criarMesAPartirDe(baseMonthData) {
  const base = deepCopy(baseMonthData);
  const resetPago = (arr) => arr.map((i) => ({ ...i, pago: false }));
  return {
    ...base,
    gastosFixos: resetPago(base.gastosFixos),
    gastosEssenciais: resetPago(base.gastosEssenciais),
    gastosNaoEssenciais: resetPago(base.gastosNaoEssenciais),
    parcelasPagas: {},
    divisao: { ...base.divisao, gastosBarbara: [], gastosBruno: [] },
  };
}

// ============================================================
// Helpers
// ============================================================

function formatBRL(v) {
  const n = Number(v);
  return new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" }).format(
    Number.isFinite(n) ? n : 0
  );
}

function sumValores(arr) {
  return arr.reduce((acc, item) => acc + (Number(item.valor) || 0), 0);
}

function uid() {
  return Math.random().toString(36).slice(2, 9);
}

function deepCopy(obj) {
  return JSON.parse(JSON.stringify(obj));
}

// ============================================================
// Compras parceladas
// Ficam num único lugar (raiz dos dados) e são "projetadas" em cada mês na hora de
// calcular/mostrar. Assim, editar ou apagar uma compra vale pra todos os meses, e
// criar um mês novo já traz as parcelas que caem nele.
// ============================================================

function monthIndex(key) {
  const [y, m] = String(key).split("-").map(Number);
  return y * 12 + (m - 1);
}

function mesesEntre(a, b) {
  return monthIndex(b) - monthIndex(a);
}

// Divide o total em N parcelas em centavos. A sobra de centavos fica na 1ª parcela.
// (Se a compra tiver juros, informe o total JÁ com juros.)
function valorParcelas(valorTotal, n) {
  const cents = Math.round((Number(valorTotal) || 0) * 100);
  const nn = Math.max(1, Math.floor(Number(n) || 1));
  const base = Math.floor(cents / nn);
  const resto = cents - base * nn;
  return Array.from({ length: nn }, (_, i) => (base + (i === 0 ? resto : 0)) / 100);
}

// Qual parcela cai no mês `monthKey` (ou null se nenhuma).
function parcelaDoMes(p, monthKey) {
  const idx = mesesEntre(p.inicio, monthKey) + 1;
  if (idx < 1 || idx > p.parcelas) return null;
  if (p.visivelDe && monthKey < p.visivelDe) return null;
  return { numero: idx, valor: valorParcelas(p.valorTotal, p.parcelas)[idx - 1] };
}

// Devolve uma CÓPIA do mês com as parcelas que caem nele: as da casa em `gastosParcelas`,
// as das abinhas junto dos gastos de cada um (marcadas com `virtual: true`).
// Só pra calcular/mostrar — nunca gravar isso de volta.
function aplicarParcelamentos(monthData, monthKey, parcelamentos, cartoesCfg) {
  const lista = Array.isArray(parcelamentos) ? parcelamentos : [];
  const pagas = monthData.parcelasPagas || {};
  const out = { casa: [], barbara: [], bruno: [] };
  lista.forEach((p) => {
    const info = parcelaDoMes(p, monthKey);
    if (!info) return;
    const cfg = cartoesCfg && cartoesCfg[p.cartao];
    const V = cfg ? Number(cfg.diaVencimento) : NaN;
    out[p.destino === "barbara" || p.destino === "bruno" ? p.destino : "casa"].push({
      id: "parc-" + p.id,
      parcelamentoId: p.id,
      nome: p.nome,
      valor: info.valor,
      cartao: normCartao(p.cartao),
      responsavel: p.destino === "barbara" ? "Bárbara" : p.destino === "bruno" ? "Bruno" : "Casa",
      vencimento: Number.isInteger(V) && V >= 1 && V <= 31 ? V : "",
      pago: !!pagas[p.id],
      parcela: { numero: info.numero, total: p.parcelas },
      virtual: true,
    });
  });
  const div = monthData.divisao || {};
  return {
    ...monthData,
    gastosParcelas: out.casa,
    divisao: {
      ...div,
      gastosBarbara: [...(div.gastosBarbara || []), ...out.barbara],
      gastosBruno: [...(div.gastosBruno || []), ...out.bruno],
    },
  };
}

function pad2(n) {
  return String(n).padStart(2, "0");
}

function hojeISO() {
  const d = new Date();
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function diaValido(v) {
  const n = Number(v);
  return Number.isInteger(n) && n >= 1 && n <= 31;
}

// Em qual mês a 1ª parcela aparece na fatura, a partir da data da compra e do cartão.
// Regra usada (a da Nubank, segundo o blog oficial): compras feitas A PARTIR do dia do
// fechamento só entram na fatura seguinte. A fatura "do mês" é a que VENCE nesse mês;
// sem dia de vencimento informado, uso o mês do fechamento.
function mesDaFatura(dataISO, cfg, fallbackMonth) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dataISO || "");
  if (!m) return { mes: fallbackMonth, motivo: "Informe a data da compra pra eu calcular em qual fatura cai." };
  const compraMes = `${m[1]}-${m[2]}`;
  const dia = Number(m[3]);
  if (!cfg || !diaValido(cfg.diaFechamento)) {
    return { mes: compraMes, motivo: "Sem dia de fechamento configurado pra esse cartão — usei o mês da compra." };
  }
  const C = Number(cfg.diaFechamento);
  const fechaNoMes = dia < C ? compraMes : shiftMonthKey(compraMes, 1);
  const temV = diaValido(cfg.diaVencimento);
  const V = Number(cfg.diaVencimento);
  const mesFatura = !temV || V > C ? fechaNoMes : shiftMonthKey(fechaNoMes, 1);
  const motivo =
    `Fecha dia ${C}: essa compra entra na fatura que fecha em ${monthKeyToLabel(fechaNoMes)}` +
    (temV
      ? ` e vence dia ${V} de ${monthKeyToLabel(mesFatura)}.`
      : ". Sem o dia de vencimento, considerei o mês do fechamento — informe o vencimento em Editar → Cartões pra eu acertar.");
  return { mes: mesFatura, motivo };
}

function calcularOrcamento(data) {
  const r = data.receitas;
  const receitaDinheiro = (Number(r.salarioBarbara) || 0) + (Number(r.salarioBruno) || 0);
  const receitaTotal =
    receitaDinheiro +
    (Number(r.va) || 0) +
    (Number(r.vtBarbara) || 0) +
    (Number(r.vrBarbara) || 0) +
    (Number(r.vrBruno) || 0);

  const totalFixos = sumValores(data.gastosFixos);
  const totalEssenciais = sumValores(data.gastosEssenciais);
  const totalNaoEssenciais = sumValores(data.gastosNaoEssenciais);

  const aluguelItem = data.gastosFixos.find((i) => i.id === "aluguel");
  const aluguel = aluguelItem ? Number(aluguelItem.valor) || 0 : 0;

  const gastoEssencialMensal = aluguel + totalEssenciais;
  const metaReserva = gastoEssencialMensal * (Number(data.poupanca.mesesReserva) || 0);
  const faltaReserva = Math.max(metaReserva - (Number(data.poupanca.valorJaGuardado) || 0), 0);

  const valorMensalReserva = receitaDinheiro * (Number(data.poupanca.pctReserva) || 0);
  const valorMensalInvestimento = receitaDinheiro * (Number(data.poupanca.pctInvestimento) || 0);
  const totalPoupanca = valorMensalReserva + valorMensalInvestimento;

  const totalParcelasCasa = sumValores(data.gastosParcelas || []);

  const totalAlocado = totalFixos + totalEssenciais + totalNaoEssenciais + totalParcelasCasa + totalPoupanca;
  const saldoNaoAlocado = receitaTotal - totalAlocado;

  // Gastos lançados nas abinhas saem do saldo não alocado. O saldo "planejado"
  // (saldoNaoAlocado) continua sendo a base de cálculo das cotas de cada um;
  // a sobra real é o que realmente ainda resta depois desses gastos.
  const div = data.divisao || {};
  const gastosAbinhaBarbara = sumValores(div.gastosBarbara || []);
  const gastosAbinhaBruno = sumValores(div.gastosBruno || []);
  const totalAbinhas = gastosAbinhaBarbara + gastosAbinhaBruno;
  const sobraReal = saldoNaoAlocado - totalAbinhas;

  const mesesAteReserva = valorMensalReserva > 0 ? faltaReserva / valorMensalReserva : null;

  return {
    receitaDinheiro,
    receitaTotal,
    totalFixos,
    totalEssenciais,
    totalNaoEssenciais,
    totalParcelasCasa,
    aluguel,
    gastoEssencialMensal,
    metaReserva,
    faltaReserva,
    valorMensalReserva,
    valorMensalInvestimento,
    totalPoupanca,
    totalAlocado,
    saldoNaoAlocado,
    gastosAbinhaBarbara,
    gastosAbinhaBruno,
    totalAbinhas,
    sobraReal,
    mesesAteReserva,
  };
}

// Saldo do mês por "carteira" (dinheiro e cada vale): quanto entrou, quanto já foi gasto,
// quanto ainda vai sair e quanto sobra. `data` precisa ser o mês COM as parcelas aplicadas
// e `calc` o resultado de calcularOrcamento(data).
//  - "Já gasto" = despesas marcadas como pagas (aba Contas) + gastos lançados nas abinhas.
//    (parcela de compra parcelada só conta quando marcada como paga.)
//  - Cada despesa da casa sai do vale escolhido em "Pago com" (até o limite do que entrou
//    naquele vale; o que passar sai do dinheiro). Parcelas e gastos das abinhas = dinheiro.
//  - Reserva + investimentos são separados do dinheiro: não são gasto, mas não sobram.
function calcularCarteiras(data, calc) {
  const num = (x) => Number(x) || 0;
  const r = data.receitas || {};
  const entrada = {
    dinheiro: num(r.salarioBarbara) + num(r.salarioBruno),
    va: num(r.va),
    vt_barbara: num(r.vtBarbara),
    vr_barbara: num(r.vrBarbara),
    vr_bruno: num(r.vrBruno),
  };
  const restante = { ...entrada };
  const previsto = { dinheiro: 0, va: 0, vt_barbara: 0, vr_barbara: 0, vr_bruno: 0 };
  const pago = { ...previsto };
  const excedeu = { ...previsto }; // quanto passou do vale e foi pro dinheiro

  const casa = [...(data.gastosFixos || []), ...(data.gastosEssenciais || []), ...(data.gastosNaoEssenciais || [])];
  casa.forEach((i) => {
    const v = num(i.valor);
    if (v === 0) return;
    const w = normVale(i.vale);
    let uso = 0;
    if (w !== "nenhum" && v > 0) {
      const quer = num(i.valeValor) > 0 ? Math.min(num(i.valeValor), v) : v;
      uso = Math.min(quer, restante[w]);
      restante[w] -= uso;
      if (quer > uso) excedeu[w] += quer - uso;
    }
    const emDinheiro = v - uso;
    previsto.dinheiro += emDinheiro;
    if (uso > 0) previsto[w] += uso;
    if (i.pago) {
      pago.dinheiro += emDinheiro;
      if (uso > 0) pago[w] += uso;
    }
  });
  (data.gastosParcelas || []).forEach((i) => {
    const v = num(i.valor);
    previsto.dinheiro += v;
    if (i.pago) pago.dinheiro += v;
  });
  const div = data.divisao || {};
  [...(div.gastosBarbara || []), ...(div.gastosBruno || [])].forEach((g) => {
    const v = num(g.valor);
    previsto.dinheiro += v;
    // gasto lançado na abinha já aconteceu; parcela só conta como gasta se marcada como paga
    if (!g.virtual || g.pago) pago.dinheiro += v;
  });

  const reservado = { dinheiro: num(calc && calc.totalPoupanca), va: 0, vt_barbara: 0, vr_barbara: 0, vr_bruno: 0 };
  const carteiras = CARTEIRAS.map((c) => ({
    ...c,
    entrada: entrada[c.id],
    gasto: pago[c.id],
    aPagar: previsto[c.id] - pago[c.id],
    reservado: reservado[c.id],
    sobra: entrada[c.id] - previsto[c.id] - reservado[c.id],
    aindaTem: entrada[c.id] - pago[c.id],
    excedeu: excedeu[c.id],
  }));
  const soma = (campo, filtro) => carteiras.filter(filtro || (() => true)).reduce((a, c) => a + c[campo], 0);
  const ehVale = (c) => c.id !== "dinheiro";
  return {
    carteiras,
    totalEntrada: soma("entrada"),
    totalGasto: soma("gasto"),
    totalAPagar: soma("aPagar"),
    totalReservado: soma("reservado"),
    aindaTemos: soma("aindaTem"),
    sobraDinheiro: carteiras[0].sobra,
    sobraVales: soma("sobra", ehVale),
    sobraTotal: soma("sobra"),
  };
}

// Soma, por cartão, tudo que foi marcado como pago nele no mês
// (gastos fixos, essenciais, não essenciais e gastos lançados nas abinhas).
function calcularCartoes(data) {
  const out = {
    barbara: { total: 0, itens: [] },
    bruno_xp: { total: 0, itens: [] },
    bruno_nubank: { total: 0, itens: [] },
    bruno: { total: 0, itens: [] }, // gastos marcados antes de separar XP e Nubank do Bruno
  };
  const coletar = (arr, origem) => {
    (arr || []).forEach((i) => {
      const c = normCartao(i.cartao);
      const v = Number(i.valor) || 0;
      if (c === "nenhum" || v === 0) return;
      out[c].total += v;
      out[c].itens.push({
        id: i.id,
        nome: i.nome,
        valor: v,
        origem: i.virtual && i.parcela ? `Parcela ${i.parcela.numero}/${i.parcela.total} · ${origem}` : origem,
      });
    });
  };
  const div = data.divisao || {};
  coletar(data.gastosFixos, "Fixo");
  coletar(data.gastosEssenciais, "Essencial");
  coletar(data.gastosNaoEssenciais, "Não essencial");
  coletar(data.gastosParcelas, "Casa");
  coletar(div.gastosBarbara, "Abinha da Bárbara");
  coletar(div.gastosBruno, "Abinha do Bruno");
  return out;
}

function calcularDivisao(data, saldoNaoAlocado) {
  const salarioBarbara = Number(data.receitas.salarioBarbara) || 0;
  const salarioBruno = Number(data.receitas.salarioBruno) || 0;
  let pctBarbara;
  if (data.divisao.metodo === "5050") {
    pctBarbara = 0.5;
  } else if (data.divisao.metodo === "proporcional") {
    const total = salarioBarbara + salarioBruno;
    pctBarbara = total > 0 ? salarioBarbara / total : 0.5;
  } else {
    pctBarbara = Number(data.divisao.pctBarbaraCustom);
    if (!Number.isFinite(pctBarbara)) pctBarbara = 0.5;
  }
  const valorBarbara = saldoNaoAlocado * pctBarbara;
  const valorBruno = saldoNaoAlocado * (1 - pctBarbara);
  return { pctBarbara, valorBarbara, valorBruno };
}

        <>

          <input
            type="number"
            min="0"
            placeholder="tudo"
            aria-label="Quanto desse gasto sai do vale (vazio = tudo)"
            value={Number(valeValor) > 0 ? valeValor : ""}
            onChange={(e) => onChangeValor(Math.max(parseFloat(e.target.value) || 0, 0))}
            className="w-14 text-xs bg-transparent outline-none border-b"
            style={{ color: COLORS.ink, borderColor: COLORS.border }}
          />
        </>
      )}
    </span>
  );
}

// Barra de uma carteira: já gasto | falta pagar | guardado (reserva+invest.) | sobra (vazio)
function BarraCarteira({ entrada, gasto, aPagar, reservado, cor }) {
  const pct = (v) => (entrada > 0 ? Math.max(0, (v / entrada) * 100) : 0);
  let g = pct(gasto);
  let a = pct(aPagar);
  let r = pct(reservado);
  const total = g + a + r;
  if (total > 100) {
    const f = 100 / total;
    g *= f;
    a *= f;
    r *= f;
  }
  return (
    <div className="flex h-2.5 rounded-full overflow-hidden" style={{ backgroundColor: "#EFE8D6" }}>
      <div style={{ width: `${g}%`, backgroundColor: cor }} />
      <div style={{ width: `${a}%`, backgroundColor: cor, opacity: 0.35 }} />
      <div style={{ width: `${r}%`, backgroundColor: COLORS.steel }} />
    </div>
  );
}

function descCfgCartao(cfg) {
  if (!cfg) return "";
  const partes = [];
  if (diaValido(cfg.diaFechamento)) partes.push(`fecha dia ${Number(cfg.diaFechamento)}`);
  if (diaValido(cfg.diaVencimento)) partes.push(`vence dia ${Number(cfg.diaVencimento)}`);
  return partes.join(" · ");
}

const inputLinha = "w-full text-sm bg-transparent outline-none border-b py-1.5";

// Formulário: valor total + nº de parcelas. O app distribui pelos meses seguintes.
function ParceladoForm({ cartoesCfg, monthKey, destinoFixo, onAdd, onCancel }) {
  const [nome, setNome] = useState("");
  const [valorTotal, setValorTotal] = useState("");
  const [parcelas, setParcelas] = useState("");
  const [cartao, setCartao] = useState(destinoFixo === "bruno" ? "bruno_xp" : "barbara");
  const [destino, setDestino] = useState(destinoFixo || "casa");
  const [dataCompra, setDataCompra] = useState(hojeISO());
  const [inicioManual, setInicioManual] = useState("");

  const sug =
    cartao === "nenhum"
      ? {
          mes: /^\d{4}-\d{2}/.test(dataCompra) ? dataCompra.slice(0, 7) : monthKey,
          motivo: "Sem cartão: a 1ª parcela cai no mês da compra.",
        }
      : mesDaFatura(dataCompra, cartoesCfg[cartao], monthKey);
  const inicio = inicioManual || sug.mes;

  const vt = Number(valorTotal);
  const n = Math.floor(Number(parcelas));
  const valido = nome.trim() !== "" && vt > 0 && n >= 1 && n <= 60 && /^\d{4}-\d{2}$/.test(inicio);
  const lista = valido ? valorParcelas(vt, n) : [];
  const fim = valido ? shiftMonthKey(inicio, n - 1) : "";
  const jaComecou = valido && inicio < monthKey;

  function enviar() {
    if (!valido) return;
    onAdd({
      id: uid(),
      nome: nome.trim(),
      valorTotal: vt,
      parcelas: n,
      inicio,
      // parcelas anteriores ao mês aberto agora não mexem no histórico
      visivelDe: inicio > monthKey ? inicio : monthKey,
      cartao,
      destino,
      dataCompra,
    });
  }

  return (
    <div className="rounded-2xl border p-3 space-y-3" style={{ borderColor: COLORS.primary, backgroundColor: "#FBF8FE" }}>
      <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
        Nova compra parcelada
      </p>

      <label className="block">
        <span className="text-xs" style={{ color: COLORS.inkSoft }}>
          O que foi
        </span>
        <input
          value={nome}
          onChange={(e) => setNome(e.target.value)}
          placeholder="Ex.: Sofá"
          className={inputLinha}
          style={{ color: COLORS.ink, borderColor: COLORS.border }}
        />
      </label>

      <div className="grid grid-cols-2 gap-3">
        <label className="block">
          <span className="text-xs" style={{ color: COLORS.inkSoft }}>
            Valor total
          </span>
          <input
            type="number"
            inputMode="decimal"
            value={valorTotal}
            onChange={(e) => setValorTotal(e.target.value)}
            placeholder="R$"
            className={inputLinha}
            style={{ color: COLORS.ink, borderColor: COLORS.border }}
          />
        </label>
        <label className="block">
          <span className="text-xs" style={{ color: COLORS.inkSoft }}>
            Nº de parcelas
          </span>
          <input
            type="number"
            inputMode="numeric"
            min="1"
            max="60"
            value={parcelas}
            onChange={(e) => setParcelas(e.target.value)}
            placeholder="Ex.: 10"
            className={inputLinha}
            style={{ color: COLORS.ink, borderColor: COLORS.border }}
          />
        </label>
      </div>

      <p className="text-xs -mt-1" style={{ color: COLORS.inkSoft }}>
        Se a compra tiver juros, informe o valor total já com os juros. A sobra de centavos da divisão fica na 1ª
        parcela, então pode haver diferença de centavos pra fatura real.
      </p>

      <div className="grid grid-cols-2 gap-3">
        <label className="block">
          <span className="text-xs" style={{ color: COLORS.inkSoft }}>
            Cartão
          </span>
          <select
            value={cartao}
            onChange={(e) => {
              setCartao(e.target.value);
              setInicioManual("");
            }}
            className={inputLinha}
            style={{ color: COLORS.ink, borderColor: COLORS.border }}
          >
            {CARTOES.map((c) => (
              <option key={c.id} value={c.id}>
                {c.label}
              </option>
            ))}
          </select>
        </label>
        <label className="block">
          <span className="text-xs" style={{ color: COLORS.inkSoft }}>
            Data da compra
          </span>
          <input
            type="date"
            value={dataCompra}
            onChange={(e) => {
              setDataCompra(e.target.value);
              setInicioManual("");
            }}
            className={inputLinha}
            style={{ color: COLORS.ink, borderColor: COLORS.border }}
          />
        </label>
      </div>

      {!destinoFixo && (
        <label className="block">
          <span className="text-xs" style={{ color: COLORS.inkSoft }}>
            Quem paga
          </span>
          <select
            value={destino}
            onChange={(e) => setDestino(e.target.value)}
            className={inputLinha}
            style={{ color: COLORS.ink, borderColor: COLORS.border }}
          >
            {DESTINOS_PARCELA.map((d) => (
              <option key={d.id} value={d.id}>
                {d.label}
              </option>
            ))}
          </select>
        </label>
      )}

      <label className="block">
        <span className="text-xs" style={{ color: COLORS.inkSoft }}>
          1ª parcela cai em
        </span>
        <input
          type="month"
          value={inicio}
          onChange={(e) => setInicioManual(e.target.value)}
          className={inputLinha}
          style={{ color: COLORS.ink, borderColor: COLORS.border }}
        />
        <span className="block text-xs mt-1" style={{ color: COLORS.inkSoft }}>
          {inicioManual && inicioManual !== sug.mes ? "Você ajustou o mês manualmente." : sug.motivo}
        </span>
      </label>

      {valido && (
        <div className="rounded-xl p-2.5 text-xs" style={{ backgroundColor: "#EFE6F5", color: COLORS.primaryDark }}>
          {n}x de {formatBRL(lista[1] !== undefined ? lista[1] : lista[0])}
          {lista[1] !== undefined && lista[0] !== lista[1] ? ` (1ª de ${formatBRL(lista[0])})` : ""} · de{" "}
          {monthKeyToLabel(inicio)} até {monthKeyToLabel(fim)}
          {jaComecou && (
            <span className="block mt-1" style={{ color: COLORS.inkSoft }}>
              Começou antes de {monthKeyToLabel(monthKey)}: os meses anteriores do histórico não são alterados.
            </span>
          )}
        </div>
      )}

      <div className="flex gap-2">
        <button
          onClick={enviar}
          disabled={!valido}
          className="flex-1 text-sm py-2.5 rounded-full text-white font-medium"
          style={{ backgroundColor: COLORS.primary, opacity: valido ? 1 : 0.45 }}
        >
          Cadastrar
        </button>
        <button
          onClick={onCancel}
          className="flex-1 text-sm py-2.5 rounded-full border"
          style={{ borderColor: COLORS.border, color: COLORS.inkSoft }}
        >
          Cancelar
        </button>
      </div>
    </div>
  );
}

// Lista de todas as compras parceladas (e onde cada uma está neste mês)
function ParcelamentosCard({ parcelamentos, setParcelamentos, cartoesCfg, monthKey }) {
  const [showForm, setShowForm] = useState(false);
  const [confirmId, setConfirmId] = useState(null);
  const labelDe = (arr, id) => (arr.find((x) => x.id === id) || arr[0]).label;

  return (
    <div className="rounded-3xl border p-4" style={{ borderColor: COLORS.border, backgroundColor: COLORS.cream }}>
      <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
        Compras parceladas
      </p>
      <p className="text-xs mt-1 mb-3" style={{ color: COLORS.inkSoft }}>
        Cadastre uma vez (valor total + nº de parcelas): a parcela aparece sozinha em cada mês até acabar.
      </p>

      {parcelamentos.length === 0 && !showForm && (
        <p className="text-xs mb-3" style={{ color: COLORS.inkSoft }}>
          Nenhuma compra parcelada cadastrada.
        </p>
      )}

      <div className="space-y-2">
        {parcelamentos.map((p) => {
          const info = parcelaDoMes(p, monthKey);
          const primeiroMes = p.visivelDe && p.visivelDe > p.inicio ? p.visivelDe : p.inicio;
          const ultimoMes = shiftMonthKey(p.inicio, p.parcelas - 1);
          let status;
          let faltam = "";
          if (info) {
            status = `Parcela ${info.numero}/${p.parcelas} neste mês · ${formatBRL(info.valor)}`;
            const restantes = valorParcelas(p.valorTotal, p.parcelas).slice(info.numero);
            if (restantes.length > 0) {
              faltam = `Depois desta, faltam ${restantes.length} (${formatBRL(restantes.reduce((a, b) => a + b, 0))}), até ${monthKeyToLabel(ultimoMes)}`;
            } else {
              faltam = "Última parcela";
            }
          } else if (monthKey < primeiroMes) {
            status = `Começa em ${monthKeyToLabel(primeiroMes)}`;
          } else {
            status = `Terminou em ${monthKeyToLabel(ultimoMes)}`;
          }
          return (
            <div key={p.id} className="border-b pb-2" style={{ borderColor: COLORS.border }}>
              <div className="flex items-start justify-between gap-2">
                <div className="min-w-0">
                  <p className="text-sm truncate" style={{ color: COLORS.ink }}>
                    {p.nome}
                  </p>
                  <p className="text-xs" style={{ color: COLORS.inkSoft }}>
                    {formatBRL(p.valorTotal)} em {p.parcelas}x · {rotuloCartao(p.cartao)} ·{" "}
                    {labelDe(DESTINOS_PARCELA, p.destino)}
                  </p>
                </div>
                {confirmId === p.id ? (
                  <div className="flex items-center gap-1 shrink-0">
                    <button
                      onClick={() => {
                        setParcelamentos((prev) => prev.filter((x) => x.id !== p.id));
                        setConfirmId(null);
                      }}
                      className="text-xs px-2 py-1 rounded-full text-white"
                      style={{ backgroundColor: COLORS.danger }}
                    >
                      Apagar
                    </button>
                    <button onClick={() => setConfirmId(null)} className="text-xs px-1" style={{ color: COLORS.inkSoft }}>
                      Não
                    </button>
                  </div>
                ) : (
                  <button onClick={() => setConfirmId(p.id)} aria-label="Apagar compra parcelada" className="shrink-0">
                    <Trash2 size={14} color={COLORS.inkSoft} />
                  </button>
                )}
              </div>
              <p className="text-xs mt-1 font-medium" style={{ color: info ? COLORS.primary : COLORS.inkSoft }}>
                {status}
              </p>
              {faltam && (
                <p className="text-xs" style={{ color: COLORS.inkSoft }}>
                  {faltam}
                </p>
              )}
              {confirmId === p.id && (
                <p className="text-xs mt-1" style={{ color: COLORS.danger }}>
                  Apaga essa compra de TODOS os meses (passados e futuros).
                </p>
              )}
            </div>
          );
        })}
      </div>

      {showForm ? (
        <div className="mt-3">
          <ParceladoForm
            cartoesCfg={cartoesCfg}
            monthKey={monthKey}
            onAdd={(p) => {
              setParcelamentos((prev) => [...prev, p]);
              setShowForm(false);
            }}
            onCancel={() => setShowForm(false)}
          />
        </div>
      ) : (
        <button
          onClick={() => setShowForm(true)}
          className="mt-3 flex items-center gap-1 text-xs font-medium"
          style={{ color: COLORS.primary }}
        >
          <Plus size={14} /> Adicionar compra parcelada
        </button>
      )}
    </div>
  );
}

function MiniCalculator() {
  const [display, setDisplay] = useState("0");
  const [acc, setAcc] = useState(null);
  const [op, setOp] = useState(null);
  const [waitingNew, setWaitingNew] = useState(true);

  function compute(a, b, operator) {
    if (operator === "+") return a + b;
    if (operator === "-") return a - b;
    if (operator === "×") return a * b;
    if (operator === "÷") return b === 0 ? 0 : a / b;
    return b;
  }

  function inputDigit(d) {
    setDisplay((prev) => (waitingNew || prev === "0" ? String(d) : prev + String(d)));
    setWaitingNew(false);
  }
  function inputDot() {
    setDisplay((prev) => (waitingNew ? "0." : prev.includes(".") ? prev : prev + "."));
    setWaitingNew(false);
  }
  function chooseOp(nextOp) {
    const current = parseFloat(display) || 0;
    setAcc((prevAcc) => {
      if (prevAcc === null) return current;
      if (!waitingNew) return compute(prevAcc, current, op);
      return prevAcc;
    });
    setOp(nextOp);
    setWaitingNew(true);
  }
  function equals() {
    const current = parseFloat(display) || 0;
    if (acc !== null && op) {
      const result = compute(acc, current, op);
      setDisplay(String(result));
      setAcc(null);
      setOp(null);
      setWaitingNew(true);
    }
  }
  function clearAll() {
    setDisplay("0");
    setAcc(null);
    setOp(null);
    setWaitingNew(true);
  }

  const keys = ["7", "8", "9", "÷", "4", "5", "6", "×", "1", "2", "3", "-", "0", ".", "=", "+"];

  return (
    <div className="rounded-2xl p-3" style={{ backgroundColor: COLORS.primaryDark }}>
      <div className="text-right text-2xl text-white py-3 px-2 truncate font-body">{display}</div>
      <div className="grid grid-cols-4 gap-2 mt-1">
        {keys.map((k, idx) => {
          const isOp = ["+", "-", "×", "÷", "="].includes(k);
          return (
            <button
              key={idx}
              onClick={() => {
                if (k === "=") equals();
                else if (isOp) chooseOp(k);
                else if (k === ".") inputDot();
                else inputDigit(k);
              }}
              className="rounded-xl py-3 text-sm font-medium"
              style={{
                backgroundColor: isOp ? COLORS.mustard : "rgba(255,255,255,0.10)",
                color: isOp ? COLORS.primaryDark : "white",
              }}
            >
              {k}
            </button>
          );
        })}
      </div>
      <button
        onClick={clearAll}
        className="mt-2 w-full text-xs py-2 rounded-xl"
        style={{ color: "#D9C7EA" }}
      >
        Limpar
      </button>
    </div>
  );
}

function MonthSwitcher({ rootData, setRootData }) {
  const [open, setOpen] = useState(false);
  const [newMonthInput, setNewMonthInput] = useState("");
  const [confirmDelete, setConfirmDelete] = useState(null);

  const sortedDesc = Object.keys(rootData.months).sort().reverse();

  function goToOrCreate(key) {
    if (!key) return;
    setRootData((prev) => {
      if (prev.months[key]) {
        return { ...prev, activeMonth: key };
      }
      const newMonth = criarMesAPartirDe(prev.months[prev.activeMonth]);
      return { ...prev, months: { ...prev.months, [key]: newMonth }, activeMonth: key };
    });
    setOpen(false);
    setNewMonthInput("");
  }

  function selectMonth(key) {
    setRootData((prev) => ({ ...prev, activeMonth: key }));
    setOpen(false);
  }

  function deleteMonth(key) {
    setRootData((prev) => {
      const remaining = Object.keys(prev.months).filter((k) => k !== key);
      if (remaining.length === 0) return prev;
      const months = { ...prev.months };
      delete months[key];
      const activeMonth = prev.activeMonth === key ? remaining.sort()[remaining.length - 1] : prev.activeMonth;
      return { ...prev, months, activeMonth };
    });
    setConfirmDelete(null);
  }

  return (
    <div className="pt-10 px-4 pb-1 relative">
      <div className="flex items-center justify-center gap-4">
        <button
          onClick={() => goToOrCreate(shiftMonthKey(rootData.activeMonth, -1))}
          className="text-lg px-2"
          style={{ color: COLORS.inkSoft }}
          aria-label="Mês anterior"
        >
          ‹
        </button>
        <button
          onClick={() => setOpen((o) => !o)}
          className="text-sm font-medium px-2 py-1 rounded-full"
          style={{ color: COLORS.primaryDark }}
        >
          {monthKeyToLabel(rootData.activeMonth)}
        </button>
        <button
          onClick={() => goToOrCreate(shiftMonthKey(rootData.activeMonth, 1))}
          className="text-lg px-2"
          style={{ color: COLORS.inkSoft }}
          aria-label="Próximo mês"
        >
          ›
        </button>
      </div>

      {open && (
        <div
          className="absolute left-4 right-4 mt-2 rounded-2xl border z-20 p-3 space-y-1"
          style={{ borderColor: COLORS.border, backgroundColor: COLORS.cream }}
        >
          {sortedDesc.map((k) => (
            <div key={k} className="flex items-center justify-between">
              <button
                onClick={() => selectMonth(k)}
                className="text-sm py-1.5 flex-1 text-left"
                style={{
                  color: k === rootData.activeMonth ? COLORS.primaryDark : COLORS.ink,
                  fontWeight: k === rootData.activeMonth ? 600 : 400,
                }}
              >
                {monthKeyToLabel(k)}
              </button>
              {confirmDelete === k ? (
                <div className="flex items-center gap-1">
                  <button
                    onClick={() => deleteMonth(k)}
                    className="text-xs px-2 py-1 rounded-full text-white"
                    style={{ backgroundColor: COLORS.danger }}
                  >
                    Excluir
                  </button>
                  <button onClick={() => setConfirmDelete(null)} className="text-xs px-2 py-1" style={{ color: COLORS.inkSoft }}>
                    Cancelar
                  </button>
                </div>
              ) : (
                <button onClick={() => setConfirmDelete(k)} aria-label="Excluir mês">
                  <Trash2 size={14} color={COLORS.inkSoft} />
                </button>
              )}
            </div>
          ))}
          <div className="flex items-center gap-2 pt-2 border-t" style={{ borderColor: COLORS.border }}>
            <input
              type="month"
              value={newMonthInput}
              onChange={(e) => setNewMonthInput(e.target.value)}
              className="flex-1 text-xs bg-transparent outline-none"
              style={{ color: COLORS.ink }}
            />
            <button
              onClick={() => goToOrCreate(newMonthInput)}
              disabled={!newMonthInput}
              className="text-xs px-2.5 py-1.5 rounded-full text-white"
              style={{ backgroundColor: COLORS.primary, opacity: newMonthInput ? 1 : 0.5 }}
            >
              Criar
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function PersonLedger({
  cota,
  gastos,
  onChangeGastos,
  accentColor,
  accentSoft,
  parcelas = [],
  destino,
  cartoesCfg,
  monthKey,
  onAddParcelado,
}) {
  const [showForm, setShowForm] = useState(false);
  // `parcelas` são as parcelas de compras parceladas que caem neste mês (só leitura aqui;
  // pra apagar, é em Contas → Compras parceladas). Entram no gasto da abinha.
  const total = sumValores(gastos) + sumValores(parcelas);
  const restante = cota - total;

  function addGasto() {
    onChangeGastos([...gastos, { id: uid(), nome: "Novo gasto", valor: 0, data: "", cartao: "nenhum" }]);
  }
  function updateGasto(id, field, value) {
    onChangeGastos(gastos.map((g) => (g.id === id ? { ...g, [field]: value } : g)));
  }
  function removeGasto(id) {
    onChangeGastos(gastos.filter((g) => g.id !== id));
  }

  return (
    <div>
      <div className="grid grid-cols-3 gap-2 mb-3">
        <div className="rounded-xl p-2" style={{ backgroundColor: accentSoft }}>
          <p className="text-xs" style={{ color: COLORS.inkSoft }}>
            Cota
          </p>
          <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
            {formatBRL(cota)}
          </p>
        </div>
        <div className="rounded-xl p-2" style={{ backgroundColor: accentSoft }}>
          <p className="text-xs" style={{ color: COLORS.inkSoft }}>
            Gasto
          </p>
          <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
            {formatBRL(total)}
          </p>
        </div>
        <div className="rounded-xl p-2" style={{ backgroundColor: accentSoft }}>
          <p className="text-xs" style={{ color: COLORS.inkSoft }}>
            Resta
          </p>
          <p className="text-sm font-medium" style={{ color: restante < 0 ? COLORS.danger : accentColor }}>
            {formatBRL(restante)}
          </p>
        </div>
      </div>

      {gastos.length === 0 && parcelas.length === 0 && (
        <p className="text-xs mb-2" style={{ color: COLORS.inkSoft }}>
          Nenhum gasto lançado ainda nesse mês.
        </p>
      )}

      <div className="space-y-2">
        {gastos.map((g) => (
          <div key={g.id} className="border-b pb-1.5" style={{ borderColor: COLORS.border }}>
            <div className="flex items-center gap-2">
              <input
                value={g.nome}
                onChange={(e) => updateGasto(g.id, "nome", e.target.value)}
                className="flex-1 text-sm bg-transparent outline-none"
                style={{ color: COLORS.ink }}
                placeholder="Descrição"
              />
              <input
                type="number"
                value={g.valor}
                onChange={(e) => updateGasto(g.id, "valor", parseFloat(e.target.value) || 0)}
                className="w-16 text-sm text-right bg-transparent outline-none"
                style={{ color: COLORS.ink }}
              />
              <button onClick={() => removeGasto(g.id)} aria-label="Remover gasto">
                <Trash2 size={13} color={COLORS.inkSoft} />
              </button>
            </div>
            <div className="mt-1">
              <CartaoSelect value={g.cartao} onChange={(v) => updateGasto(g.id, "cartao", v)} />
            </div>
          </div>
        ))}
      </div>
      {parcelas.length > 0 && (
        <div className="space-y-2 mt-2">
          {parcelas.map((g) => (
            <div key={g.id} className="flex items-center gap-2 border-b pb-1.5" style={{ borderColor: COLORS.border }}>
              <div className="flex-1 min-w-0">
                <p className="text-sm truncate" style={{ color: COLORS.ink }}>
                  {g.nome}
                </p>
                <p className="text-xs" style={{ color: COLORS.inkSoft }}>
                  Parcela {g.parcela.numero}/{g.parcela.total} · {g.cartao === "nenhum" ? "sem cartão" : rotuloCartao(g.cartao)}
                </p>
              </div>
              <span className="text-sm" style={{ color: COLORS.ink }}>
                {formatBRL(g.valor)}
              </span>
            </div>
          ))}
        </div>
      )}
      <div className="mt-3 flex flex-wrap items-center gap-x-5 gap-y-2">
        <button onClick={addGasto} className="flex items-center gap-1 text-xs font-medium" style={{ color: accentColor }}>
          <Plus size={13} /> Adicionar gasto
        </button>
        {onAddParcelado && !showForm && (
          <button
            onClick={() => setShowForm(true)}
            className="flex items-center gap-1 text-xs font-medium"
            style={{ color: accentColor }}
          >
            <CreditCard size={13} color={accentColor} /> Compra parcelada
          </button>
        )}
      </div>
      {onAddParcelado && showForm && (
        <div className="mt-3">
          <ParceladoForm
            cartoesCfg={cartoesCfg}
            monthKey={monthKey}
            destinoFixo={destino}
            onAdd={(p) => {
              onAddParcelado(p);
              setShowForm(false);
            }}
            onCancel={() => setShowForm(false)}
          />
        </div>
      )}
    </div>
  );
}

function TabContas({ data, dataEfetiva, setData, monthKey, parcelamentos, setParcelamentos, cartoesCfg }) {
  // parcelas de compras parceladas que caem neste mês (da casa e das abinhas)
  const parcelasMes = [
    ...(dataEfetiva.gastosParcelas || []),
    ...dataEfetiva.divisao.gastosBarbara.filter((g) => g.virtual),
    ...dataEfetiva.divisao.gastosBruno.filter((g) => g.virtual),
  ].map((i) => ({ ...i, _src: "parcela" }));

  const sourced = [
    ...data.gastosFixos.map((i) => ({ ...i, _src: "gastosFixos" })),
    ...data.gastosEssenciais.map((i) => ({ ...i, _src: "gastosEssenciais" })),
    ...data.gastosNaoEssenciais.filter((i) => Number(i.valor) > 0).map((i) => ({ ...i, _src: "gastosNaoEssenciais" })),
    ...parcelasMes,
  ].sort((a, b) => {
    const av = a.vencimento === "" || a.vencimento == null ? 99 : Number(a.vencimento);
    const bv = b.vencimento === "" || b.vencimento == null ? 99 : Number(b.vencimento);
    return av - bv;
  });

  const totalMes = sourced.reduce((a, i) => a + (Number(i.valor) || 0), 0);
  const totalPago = sourced.filter((i) => i.pago).reduce((a, i) => a + (Number(i.valor) || 0), 0);
  const totalPendente = totalMes - totalPago;

  function togglePago(item) {
    if (item._src === "parcela") {
      // parcela de compra parcelada: o "pago" fica guardado por mês, separado da compra
      setData((prev) => ({
        ...prev,
        parcelasPagas: { ...(prev.parcelasPagas || {}), [item.parcelamentoId]: !item.pago },
      }));
      return;
    }
    setData((prev) => ({
      ...prev,
      [item._src]: prev[item._src].map((x) => (x.id === item.id ? { ...x, pago: !x.pago } : x)),
    }));
  }
  function updateVencimento(src, id, value) {
    setData((prev) => ({
      ...prev,
      [src]: prev[src].map((item) => (item.id === id ? { ...item, vencimento: value } : item)),
    }));
  }
  function updateCartao(src, id, value) {
    setData((prev) => ({
      ...prev,
      [src]: prev[src].map((item) => (item.id === id ? { ...item, cartao: value } : item)),
    }));
  }

  return (
    <div className="px-4 pt-2 pb-4 space-y-4">
      <h1 className="font-display text-2xl" style={{ color: COLORS.primaryDark }}>
        Contas do mês
      </h1>
      <p className="text-xs" style={{ color: COLORS.inkSoft }}>
        Marque o que já foi pago. O que sobrar é o que ainda precisa sair da conta esse mês.
      </p>
      <div className="grid grid-cols-2 gap-3">
        <StatCard label="Já pago" value={totalPago} />
        <StatCard label="Ainda por pagar" value={totalPendente} />
      </div>
      <FaturasCard data={dataEfetiva} cfg={cartoesCfg} />
      <ParcelamentosCard
        parcelamentos={parcelamentos}
        setParcelamentos={setParcelamentos}
        cartoesCfg={cartoesCfg}
        monthKey={monthKey}
      />
      <div className="space-y-2">
        {sourced.map((item) => (
          <div
            key={item.id}
            className="flex items-center gap-3 rounded-2xl border px-3 py-2.5"
            style={{ borderColor: COLORS.border, backgroundColor: item.pago ? "#EFEBDC" : COLORS.cream }}
          >
            <button onClick={() => togglePago(item)} aria-label="Marcar como pago">
              {item.pago ? <CheckCircle2 size={22} color={COLORS.primary} /> : <Circle size={22} color={COLORS.border} />}
            </button>
            <div className="flex-1 min-w-0">
              <p
                className="text-sm truncate"
                style={{
                  color: item.pago ? COLORS.inkSoft : COLORS.ink,
                  textDecoration: item.pago ? "line-through" : "none",
                }}
              >
                {item.nome}
              </p>
              <div className="flex items-center gap-2 mt-1">
                <PersonBadge pessoa={item.responsavel} />
                {item._src === "parcela" ? (
                  <span className="text-xs" style={{ color: COLORS.inkSoft }}>
                    {item.vencimento !== "" ? `vence dia ${item.vencimento}` : "parcela da fatura"}
                  </span>
                ) : (
                  <>
                    <span className="text-xs" style={{ color: COLORS.inkSoft }}>
                      dia
                    </span>
                    <input
                      placeholder="—"
                      value={item.vencimento}
                      onChange={(e) => updateVencimento(item._src, item.id, e.target.value.replace(/[^0-9]/g, "").slice(0, 2))}
                      className="w-8 text-xs bg-transparent outline-none border-b"
                      style={{ color: COLORS.inkSoft, borderColor: COLORS.border }}
                    />
                  </>
                )}
              </div>
              {item._src === "parcela" ? (
                <p className="text-xs mt-1 flex items-center gap-1" style={{ color: COLORS.primary }}>
                  <CreditCard size={12} color={COLORS.primary} />
                  Parcela {item.parcela.numero}/{item.parcela.total}
                  {item.cartao !== "nenhum" && ` · ${rotuloCartao(item.cartao)}`}
                </p>
              ) : (
                <>
                  <div className="mt-1">
                    <CartaoSelect value={item.cartao} onChange={(v) => updateCartao(item._src, item.id, v)} />
                  </div>
                  {normVale(item.vale) !== "nenhum" && (
                    <p className="text-xs mt-1" style={{ color: COLORS.primary }}>
                      Pago com {rotuloVale(item.vale)}
                      {Number(item.valeValor) > 0 ? ` (${formatBRL(item.valeValor)})` : ""}
                    </p>
                  )}
                </>
              )}
            </div>
            <span className="text-sm font-medium whitespace-nowrap" style={{ color: COLORS.primaryDark }}>
              {formatBRL(item.valor)}
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

function TabSimulador({ data, setData, monthKey, parcelamentos, cartoesCfg }) {
  const [simData, setSimData] = useState(() => deepCopy(data));
  const [showCalc, setShowCalc] = useState(false);

  useEffect(() => {
    setSimData(deepCopy(data));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data]);

  // O cálculo considera as parcelas que caem neste mês, igual ao orçamento real.
  const realCalc = useMemo(
    () => calcularOrcamento(aplicarParcelamentos(data, monthKey, parcelamentos, cartoesCfg)),
    [data, monthKey, parcelamentos, cartoesCfg]
  );
  const simCalc = useMemo(
    () => calcularOrcamento(aplicarParcelamentos(simData, monthKey, parcelamentos, cartoesCfg)),
    [simData, monthKey, parcelamentos, cartoesCfg]
  );
  const delta = simCalc.sobraReal - realCalc.sobraReal;

  function resetSim() {
    setSimData(deepCopy(data));
  }
  function applyToReal() {
    setData(deepCopy(simData));
  }
  function updateSimReceita(field, value) {
    setSimData((prev) => ({ ...prev, receitas: { ...prev.receitas, [field]: value } }));
  }

  return (
    <div className="px-4 pt-2 pb-4 space-y-4">
      <h1 className="font-display text-2xl" style={{ color: COLORS.primaryDark }}>
        Simulador
      </h1>
      <p className="text-xs" style={{ color: COLORS.inkSoft }}>
        Mude qualquer valor aqui pra testar cenários. Não afeta o orçamento real até você aplicar.
      </p>

      <div className="rounded-3xl p-4" style={{ backgroundColor: COLORS.primaryDark }}>
        <p className="text-xs" style={{ color: "#D9C7EA" }}>
          Sobra simulada
        </p>
        <p className="font-display text-3xl text-white mt-1">{formatBRL(simCalc.sobraReal)}</p>
        <p
          className="text-xs mt-1"
          style={{ color: delta === 0 ? "#B79ACC" : delta > 0 ? "#9FE3B0" : "#F0A8A0" }}
        >
          {delta === 0
            ? "Igual ao orçamento real"
            : `${delta > 0 ? "+" : ""}${formatBRL(delta)} em relação ao real`}
        </p>
      </div>

      <div className="rounded-3xl border p-4 space-y-3" style={{ borderColor: COLORS.border, backgroundColor: COLORS.cream }}>
        <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
          Receitas (simulação)
        </p>
        <div className="grid grid-cols-2 gap-3">
          <NumberField
            label="Salário — Bárbara"
            value={simData.receitas.salarioBarbara}
            onChange={(v) => updateSimReceita("salarioBarbara", v)}
            prefix="R$"
          />
          <NumberField
            label="Salário — Bruno"
            value={simData.receitas.salarioBruno}
            onChange={(v) => updateSimReceita("salarioBruno", v)}
            prefix="R$"
          />
        </div>
      </div>

      <EditableCategoryList
        title="Gastos fixos (simulação)"
        items={simData.gastosFixos}
        onChange={(v) => setSimData((prev) => ({ ...prev, gastosFixos: v }))}
      />
      <EditableCategoryList
        title="Gastos essenciais (simulação)"
        items={simData.gastosEssenciais}
        onChange={(v) => setSimData((prev) => ({ ...prev, gastosEssenciais: v }))}
      />
      <EditableCategoryList
        title="Gastos não essenciais (simulação)"
        items={simData.gastosNaoEssenciais}
        onChange={(v) => setSimData((prev) => ({ ...prev, gastosNaoEssenciais: v }))}
      />

      <div className="space-y-2">
        <button
          onClick={applyToReal}
          className="w-full text-sm py-3 rounded-full text-white flex items-center justify-center gap-2 font-medium"
          style={{ backgroundColor: COLORS.primary }}
        >
          <Save size={15} /> Aplicar essas mudanças ao orçamento real
        </button>
        <button
          onClick={resetSim}
          className="w-full text-xs py-3 rounded-full border flex items-center justify-center gap-2"
          style={{ borderColor: COLORS.border, color: COLORS.inkSoft }}
        >
          <RotateCcw size={14} /> Resetar simulação pros valores reais
        </button>
      </div>

      <button
        onClick={() => setShowCalc((s) => !s)}
        className="w-full text-sm py-3 rounded-full flex items-center justify-center gap-2 font-medium"
        style={{ backgroundColor: COLORS.mustard, color: COLORS.primaryDark }}
      >
        <CalculatorIcon size={15} /> {showCalc ? "Esconder calculadora" : "Abrir calculadora rápida"}
      </button>
      {showCalc && <MiniCalculator />}
    </div>
  );
}

              onAddParcelado={addParcelado}
            />
          ) : (
            <PersonLedger
              cota={divisao.valorBruno}
              gastos={data.divisao.gastosBruno || []}
              onChangeGastos={(v) => updateDivisao("gastosBruno", v)}
              accentColor={COLORS.teal}
              accentSoft="#E6EEEC"
              parcelas={parcelasBruno}
              destino="bruno"
              cartoesCfg={cartoesCfg}
              monthKey={monthKey}
              onAddParcelado={addParcelado}
            />
          )}
        </div>
      </div>
    </div>
  );
}

function TabEditar({ data, setData, mesLabel, resetActiveMonth, cartoesCfg, setCartoesCfg }) {
  const [showResetConfirm, setShowResetConfirm] = useState(false);
  const r = data.receitas;

  function updateCfg(cartao, campo, valor) {
    setCartoesCfg((prev) => ({ ...prev, [cartao]: { ...prev[cartao], [campo]: valor } }));
  }

  function updateReceita(field, value) {
    setData((prev) => ({ ...prev, receitas: { ...prev.receitas, [field]: value } }));
  }

  return (
    <div className="px-4 pt-2 pb-4 space-y-4">
      <h1 className="font-display text-2xl" style={{ color: COLORS.primaryDark }}>
        Editar valores
      </h1>

      <div className="rounded-3xl border p-4" style={{ borderColor: COLORS.border, backgroundColor: COLORS.cream }}>
        <p className="text-xs" style={{ color: COLORS.inkSoft }}>
          Editando o mês de
        </p>
        <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
          {mesLabel}
        </p>
        <p className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>
          Pra mudar de mês, use as setinhas lá em cima, na aba Resumo.
        </p>
      </div>

      <div className="rounded-3xl border p-4 space-y-3" style={{ borderColor: COLORS.border, backgroundColor: COLORS.cream }}>
        <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
          Receitas
        </p>
        <div className="grid grid-cols-2 gap-3">
          <NumberField label="Salário líquido — Bárbara" value={r.salarioBarbara} onChange={(v) => updateReceita("salarioBarbara", v)} prefix="R$" />
          <NumberField label="Salário líquido — Bruno" value={r.salarioBruno} onChange={(v) => updateReceita("salarioBruno", v)} prefix="R$" />
          <NumberField label="VA (vale-alimentação)" value={r.va} onChange={(v) => updateReceita("va", v)} prefix="R$" />
          <NumberField label="VT — Bárbara" value={r.vtBarbara} onChange={(v) => updateReceita("vtBarbara", v)} prefix="R$" />
          <NumberField label="VR — Bárbara" value={r.vrBarbara} onChange={(v) => updateReceita("vrBarbara", v)} prefix="R$" />
          <NumberField label="VR — Bruno" value={r.vrBruno} onChange={(v) => updateReceita("vrBruno", v)} prefix="R$" />
        </div>
      </div>

      <div className="rounded-3xl border p-4 space-y-3" style={{ borderColor: COLORS.border, backgroundColor: COLORS.cream }}>
        <div>
          <p className="text-sm font-medium" style={{ color: COLORS.ink }}>
            Cartões
          </p>
          <p className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>
            Valem pra todos os meses. Com o fechamento e o vencimento, o app descobre em qual fatura cai cada
            compra parcelada. Regra usada: compras feitas a partir do dia do fechamento entram na fatura
            seguinte (é a regra da Nubank; o contrato da XP não diz o que acontece nesse dia).
          </p>
          <p className="text-xs mt-1" style={{ color: COLORS.inkSoft }}>
            Nos Nubank, o vencimento é o fechamento + 7 dias (regra da Nubank) — confira no app. O contrato da XP diz
            que o fechamento pode variar a critério do banco, então vale conferir de vez em quando.
          </p>
        </div>
        {CARTOES_COM_DATAS.map((c) => (
          <div key={c.id}>
            <p className="text-xs font-medium flex items-center gap-1" style={{ color: c.cor }}>
              <CreditCard size={13} color={c.cor} /> {c.titulo}
            </p>
            <div className="grid grid-cols-2 gap-3 mt-1">
              <DiaField
                label="Fecha"
                value={cartoesCfg[c.id].diaFechamento}
                onChange={(v) => updateCfg(c.id, "diaFechamento", v)}
              />
              <DiaField
                label="Vence"
                value={cartoesCfg[c.id].diaVencimento}
                onChange={(v) => updateCfg(c.id, "diaVencimento", v)}
              />
            </div>
          </div>
        ))}
      </div>

      <EditableCategoryList title="Gastos fixos" items={data.gastosFixos} onChange={(v) => setData((prev) => ({ ...prev, gastosFixos: v }))} />
      <EditableCategoryList title="Gastos essenciais" items={data.gastosEssenciais} onChange={(v) => setData((prev) => ({ ...prev, gastosEssenciais: v }))} />
      <EditableCategoryList title="Gastos não essenciais" items={data.gastosNaoEssenciais} onChange={(v) => setData((prev) => ({ ...prev, gastosNaoEssenciais: v }))} />

      {!showResetConfirm ? (
        <button
          onClick={() => setShowResetConfirm(true)}
          className="w-full text-xs py-3 rounded-full border"
          style={{ borderColor: COLORS.border, color: COLORS.inkSoft }}
        >
          Restaurar valores originais deste mês
        </button>
      ) : (
        <div className="rounded-2xl border p-3 text-center space-y-2" style={{ borderColor: COLORS.danger }}>
          <p className="text-xs" style={{ color: COLORS.ink }}>
            Isso substitui os valores editados de {mesLabel} pelos valores originais e apaga os gastos
            lançados nas abinhas e os cartões marcados nesse mês. Os outros meses do histórico não são
            afetados. Tem certeza?
          </p>
          <div className="flex gap-2">
            <button
              onClick={() => {
                resetActiveMonth();
                setShowResetConfirm(false);
              }}
              className="flex-1 text-xs py-2 rounded-full text-white"
              style={{ backgroundColor: COLORS.danger }}
            >
              Sim, restaurar
            </button>
            <button
              onClick={() => setShowResetConfirm(false)}
              className="flex-1 text-xs py-2 rounded-full border"
              style={{ borderColor: COLORS.border, color: COLORS.inkSoft }}
            >
              Cancelar
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

const NO_PARCELAS = [];

function App() {
  const [authState, setAuthState] = useState("loading");
  const [user, setUser] = useState(null);
  const [authError, setAuthError] = useState("");

  const [rootData, setRootData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("resumo");
  const [saved, setSaved] = useState(true);

  useEffect(() => {
    let mounted = true;
    function waitForFirebase() {
      if (window.FirebaseAPI) return Promise.resolve(window.FirebaseAPI);
      return new Promise((resolve) => {
        window.addEventListener("firebase-ready", () => resolve(window.FirebaseAPI), { once: true });
      });
    }
    (async () => {
      const api = await waitForFirebase();
      api.onAuthChange(async (fbUser) => {
        if (!mounted) return;
        setUser(fbUser);
        if (!fbUser) {
          setAuthState("signedOut");
          setLoading(false);
          return;
        }
        if (!api.ALLOWED_EMAILS.includes(fbUser.email)) {
          setAuthState("unauthorized");
          setLoading(false);
          return;
        }
        setAuthState("signedIn");
        try {
          const remoteData = await api.loadData();
          if (mounted) setRootData(buildInitialRootData(remoteData));
        } catch (e) {
          if (mounted) setRootData(buildInitialRootData(null));
        }
        if (mounted) setLoading(false);
      });
    })();
    return () => {
      mounted = false;
    };
  }, []);

  useEffect(() => {
    if (loading || !rootData || authState !== "signedIn") return;
    setSaved(false);
    const t = setTimeout(async () => {
      try {
        await window.FirebaseAPI.saveData(rootData);
        setSaved(true);
      } catch (e) {
        setSaved(true);
      }
    }, 600);
    return () => clearTimeout(t);
  }, [rootData, loading, authState]);

  async function handleSignIn() {
    setAuthError("");
    try {
      await window.FirebaseAPI.signIn();
    } catch (e) {
      setAuthError("Não deu pra entrar com o Google. Tenta de novo.");
    }
  }
  function handleSignOut() {
    window.FirebaseAPI.signOutUser();
  }
  async function handleReload() {
    if (!window.FirebaseAPI) return;
    setSaved(false);
    try {
      const remoteData = await window.FirebaseAPI.loadData();
      setRootData(buildInitialRootData(remoteData));
    } finally {
      setSaved(true);
    }
  }

  const data = rootData ? rootData.months[rootData.activeMonth] : null;
  const parcelamentos = rootData ? rootData.parcelamentos : NO_PARCELAS;
  const cartoesCfg = rootData ? rootData.cartoes : DEFAULT_CARTOES_CFG;
  const activeMonth = rootData ? rootData.activeMonth : null;
  // Mês + parcelas que caem nele (só pra calcular/mostrar — nunca é gravado)
  const dataEfetiva = useMemo(
    () => (data ? aplicarParcelamentos(data, activeMonth, parcelamentos, cartoesCfg) : null),
    [data, activeMonth, parcelamentos, cartoesCfg]
  );
  const calc = useMemo(() => (dataEfetiva ? calcularOrcamento(dataEfetiva) : null), [dataEfetiva]);
  const carteiras = useMemo(
    () => (dataEfetiva && calc ? calcularCarteiras(dataEfetiva, calc) : null),
    [dataEfetiva, calc]
  );

  const trendData = useMemo(() => {
    if (!rootData) return [];
    return Object.keys(rootData.months)
      .sort()
      .map((key) => {
        const c = calcularOrcamento(
          aplicarParcelamentos(rootData.months[key], key, rootData.parcelamentos, rootData.cartoes)
        );
        return { key, mes: monthKeyToShort(key), saldo: c.sobraReal, receita: c.receitaTotal };
      });
  }, [rootData]);

  function setData(updater) {
    setRootData((prev) => {
      const current = prev.months[prev.activeMonth];
      const next = typeof updater === "function" ? updater(current) : updater;
      return { ...prev, months: { ...prev.months, [prev.activeMonth]: next } };
    });
  }

  function resetActiveMonth() {
    setData(() => normalizeMonthData(deepCopy(DEFAULT_MONTH_DATA)));
  }

  // Compras parceladas e configuração dos cartões ficam na raiz (valem pra todos os meses)
  function setParcelamentos(updater) {
    setRootData((prev) => ({
      ...prev,
      parcelamentos: typeof updater === "function" ? updater(prev.parcelamentos || []) : updater,
    }));
  }
  function setCartoesCfg(updater) {
    setRootData((prev) => ({
      ...prev,
      cartoes: typeof updater === "function" ? updater(prev.cartoes) : updater,
    }));
  }

  if (authState === "loading") {
    return (
      <div className="min-h-screen flex items-center justify-center font-body" style={{ backgroundColor: COLORS.bg }}>
        <GlobalStyle />
        <p className="text-sm" style={{ color: COLORS.inkSoft }}>
          Carregando…
        </p>
      </div>
    );
  }
  if (authState === "signedOut") {
    return <LoginScreen onSignIn={handleSignIn} error={authError} />;
  }
  if (authState === "unauthorized") {
    return <UnauthorizedScreen email={user ? user.email : ""} onSignOut={handleSignOut} />;
  }

  if (loading || !data || !calc || !dataEfetiva || !carteiras) {
    return (
      <div className="min-h-screen flex items-center justify-center font-body" style={{ backgroundColor: COLORS.bg }}>
        <GlobalStyle />
        <p className="text-sm" style={{ color: COLORS.inkSoft }}>
          Carregando orçamento…
        </p>
      </div>
    );
  }

  const mesLabel = monthKeyToLabel(rootData.activeMonth);

  return (
    <div className="min-h-screen pb-24 font-body" style={{ backgroundColor: COLORS.bg }}>
      <GlobalStyle />
      <div className="fixed top-3 right-3 z-10 flex items-center gap-2">
        <button
          onClick={handleReload}
          className="flex items-center justify-center rounded-full"
          style={{ width: 30, height: 30, backgroundColor: COLORS.cream, border: `1px solid ${COLORS.border}` }}
          aria-label="Recarregar do servidor"
        >
          <RefreshCw size={14} color={COLORS.inkSoft} />
        </button>
        <div
          className="flex items-center gap-1.5 px-2.5 py-1 rounded-full"
          style={{ backgroundColor: COLORS.cream, border: `1px solid ${COLORS.border}` }}
        >
          <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: saved ? "#5A9B7A" : COLORS.mustard }} />
          <span className="text-xs" style={{ color: COLORS.inkSoft }}>
            {saved ? "Salvo" : "Salvando…"}
          </span>
        </div>
        <button
          onClick={handleSignOut}
          className="flex items-center justify-center rounded-full"
          style={{ width: 30, height: 30, backgroundColor: COLORS.cream, border: `1px solid ${COLORS.border}` }}
          aria-label="Sair"
        >
          <LogOut size={14} color={COLORS.inkSoft} />
        </button>
      </div>

      <div className="max-w-md mx-auto">
        <MonthSwitcher rootData={rootData} setRootData={setRootData} />
        {tab === "resumo" && (
          <TabResumo data={data} calc={calc} carteiras={carteiras} mesLabel={mesLabel} trendData={trendData} />
        )}
        {tab === "contas" && (
          <TabContas
            data={data}
            dataEfetiva={dataEfetiva}
            setData={setData}
            monthKey={activeMonth}
            parcelamentos={parcelamentos}
            setParcelamentos={setParcelamentos}
            cartoesCfg={cartoesCfg}
          />
        )}
        {tab === "simulador" && (
          <TabSimulador
            data={data}
            setData={setData}
            monthKey={activeMonth}
            parcelamentos={parcelamentos}
            cartoesCfg={cartoesCfg}
          />
        )}
        {tab === "poupanca" && (
          <TabPoupanca
            data={data}
            dataEfetiva={dataEfetiva}
            setData={setData}
            calc={calc}
            monthKey={activeMonth}
            setParcelamentos={setParcelamentos}
            cartoesCfg={cartoesCfg}
          />
        )}
        {tab === "editar" && (
          <TabEditar
            data={data}
            setData={setData}
            mesLabel={mesLabel}
            resetActiveMonth={resetActiveMonth}
            cartoesCfg={cartoesCfg}
            setCartoesCfg={setCartoesCfg}
          />
        )}
      </div>

      <BottomNav tab={tab} setTab={setTab} />
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
